[workspace]
members = [
  "crates/omen-core",
  "crates/omen-daemon",
  "crates/omen-ui",
  "crates/omen-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT"
authors = ["Amrdeep Biswas"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
egui = "0.29"
eframe = { version = "0.29", features = ["persistence"] }
egui_plot = "0.29"
resvg = "0.44"
image = "0.25"

[profile.release]
opt-level = 3           # Aggressive O3 speed optimizations [1]
lto = "fat"             # Performs massive, exhaustive optimization across all crates [1]
codegen-units = 1       # Disables parallel compilation to allow maximum global inlining [1]
panic = "abort"         # Removes stack-unwinding code, reducing binary size and boosting speed [1]
strip = "symbols"       # Strips all debug info and symbols to reduce cache pressure [1]
