[workspace]
members = [
  "crates/omen-core",
  "crates/omen-daemon",
  "crates/omen-ui",
  "crates/omen-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"
authors = ["OpenAI"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
egui = "0.29"
eframe = "0.29"
egui_plot = "0.29"
resvg = "0.44"
image = "0.25"
