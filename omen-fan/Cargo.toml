[package]
name = "omen-fan"
version = "0.7.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
nix = { version = "0.27", features = ["user"] }
actix-web = "4.4"
actix-cors = "0.6"
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

