name: Manual Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.5.1)'
        required: true

permissions:
  contents: write

jobs:
  manual-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release folder
        run: |
          mkdir -p release/omen-fan
          cp target/release/omen-fan release/omen-fan/
          cp install.sh release/omen-fan/
          cp src/omen-fan.service release/omen-fan/
          cp src/fan_config.toml release/omen-fan/

      - name: Create tarball
        run: |
          tar -czvf omen-fan-x86_64-unknown-linux-gnu.tar.gz -C release omen-fan

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omen-fan-manual-build
          path: omen-fan-x86_64-unknown-linux-gnu.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.tag_name }}
          files: omen-fan-x86_64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}